---

- name: check if there are any mounted partitions for storage device
  ansible.builtin.shell:
    cmd: lsblk -n -o NAME,MOUNTPOINT {{ storage_device }} | awk '$2 != "" {print $2}'
  register: storage_mounted_partitions
  changed_when: false

- name: skip storage role if there are mounted partitions for storage device
  ansible.builtin.meta: end_host
  when: storage_mounted_partitions.stdout_lines | length > 0
