---
# tasks file for storage
- name: gather local facts
  ansible.builtin.setup:
    filter: ansible_local

- name: detect current root boot device
  import_tasks: detect_root.yml

# - name: end role if current root device is sdcard
#   ansible.builtin.meta: end_role
#   when: not storage_current_root_device_is_sdcard

# - import_tasks: detect_disk.yml

- name: detect storage device
  import_tasks: detect_device.yml
  when: storage_root_device_is_sdcard

- name: check for mounted partitions
  import_tasks: check_mounted_partitions.yml
  when: storage_root_device_is_sdcard and (storage_device|default(''))|length > 0

# end play for host if storage device has mounted partitions

- name: partition storage device
  import_tasks: partition.yml
  when: storage_root_device_is_sdcard and (storage_device|default(''))|length > 0
