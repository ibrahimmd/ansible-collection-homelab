---
# tasks file for flightaware
- name: skip role if flightaware is already installed
  ansible.builtin.meta: end_role
  when:
    - (ansible_local.software.flightaware.installed | default('false') | bool) == true
    - (flightaware_force_install | default(false) | bool) == false

- name: import flightaware variables specific to os distribution,family or version
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts['os_family'] | lower }}-{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_version'] }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}-{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}-{{ ansible_facts['distribution'] | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}.yml"
        - "default.yml"
      paths:
        - "{{ role_path }}/vars"

- name: install flightaware
  ansible.builtin.include_tasks: run.yml
  when:
    - (flightaware_supported | default(false) | bool) == true
