---
# defaults file for cilium
cilium_path:
  fact_file: "/etc/ansible/facts.d/software.fact"
  values_file: "/etc/cilium/values.yaml"
  install_dir: "/usr/local/bin"

# cilium cli version is always latest stable
cilium_version: "1.20.2"

cilium_helm_values:
  ipam:
    mode: "cluster-pool"
    operator:
      clusterPoolIPv4PodCIDRList: "10.42.0.0/16"
      clusterPoolIPv4MaskSize: 24
  operator:
    replicas: 1
  kubeProxyReplacement: true
  k8sServiceHost: "127.0.0.1"
  k8sServicePort: "6443"
  devices: "eth0"

cilium_force_install: false
